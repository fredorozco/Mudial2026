<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Quiniela Mundialista Oficial 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <header class="bg-gradient-to-r from-blue-950 via-blue-900 to-slate-950 text-white text-center py-6 shadow-lg mb-6 relative">
        <h1 class="text-3xl font-extrabold tracking-wider">🏆 QUINIELA EN COMUNIDAD 2026 🏆</h1>
        <p class="text-sm text-blue-200 mt-2">Fase de Grupos Expandida & Eliminatorias Directas</p>
        <div id="loading-bar" class="absolute bottom-0 left-0 h-1 bg-blue-500 transition-all duration-500" style="width: 0%"></div>
    </header>

    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            
            <div class="bg-slate-800 p-5 rounded-xl shadow-md border border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-blue-400">👤 Tu Usuario</h2>
                    <button onclick="cargarDatosNube()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 transition">🔄 Sincronizar</button>
                </div>
                <div class="mb-4">
                    <select id="select-usuario" onchange="cambiarUsuario()" class="w-full bg-slate-700 text-white p-2 rounded border border-slate-600 focus:outline-none focus:border-blue-500"></select>
                </div>
                <div class="border-t border-slate-700 pt-3">
                    <div class="flex gap-2">
                        <input type="text" id="nuevo-usuario" placeholder="Tu Nombre..." class="flex-1 bg-slate-700 text-white p-2 text-sm rounded border border-slate-600 focus:outline-none">
                        <button onclick="registrarUsuario()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 text-sm font-bold rounded transition">Unirse</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl shadow-md border border-slate-700">
                <h2 class="text-lg font-bold text-yellow-400 mb-3">📊 Posiciones Globales</h2>
                <div class="overflow-hidden rounded-lg border border-slate-700">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-700 text-slate-300 font-bold">
                            <tr>
                                <th class="p-2 text-center">#</th>
                                <th class="p-2">Jugador</th>
                                <th class="p-2 text-center">Pts</th>
                                <th class="p-2 text-center">🗑️</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-posiciones" class="divide-y divide-slate-700">
                            <tr><td colspan="4" class="p-4 text-center text-slate-400">Cargando posiciones...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl shadow-md border border-slate-700 border-dashed space-y-2">
                <h3 class="text-xs font-bold text-red-400 uppercase tracking-wider">🔒 Panel de Administrador</h3>
                <button onclick="verificarAccAccessAdmin()"
