        const partidosBase = [

            { id: 12, fase: "Grupos", grupo: "Grupo B", jornada: "Jornada 3", equipoA: "Bosnia 🇧🇦", equipoB: "Qatar 🇶🇦", fechaStr: "24 de Junio", horaStr: "1:00 pm", golesA: null, golesB: null },
            { id: 13, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 1", equipoA: "Brasil 🇧🇷", equipoB: "Marruecos 🇲🇦", fechaStr: "13 de Junio", horaStr: "4:00 pm", golesA: null, golesB: null },
            { id: 14, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 1", equipoA: "Haití 🇭🇹", equipoB: "Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿", fechaStr: "13 de Junio", horaStr: "7:00 pm", golesA: null, golesB: null },
            { id: 15, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 2", equipoA: "Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿", equipoB: "Marruecos 🇲🇦", fechaStr: "19 de Junio", horaStr: "4:00 pm", golesA: null, golesB: null },
            { id: 16, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 2", equipoA: "Brasil 🇧🇷", equipoB: "Haití 🇭🇹", fechaStr: "19 de Junio", horaStr: "7:00 pm", golesA: null, golesB: null },
            { id: 17, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 3", equipoA: "Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿", equipoB: "Brasil 🇧🇷", fechaStr: "24 de Junio", horaStr: "4:00 pm", golesA: null, golesB: null },
            { id: 18, fase: "Grupos", grupo: "Grupo C", jornada: "Jornada 3", equipoA: "Marruecos 🇲🇦", equipoB: "Haití 🇭🇹", fechaStr: "24 de Junio", horaStr: "4:00 pm", golesA: null, golesB: null }
        ];

        let estadoGlobal = {
            usuarios: ["fedy", "Carlos"],
            partidos: partidosBase,
            pronosticos: {}
        };
        
        let usuarioActivo = localStorage.getItem('q_pro_usuario') || "fedy";
        let faseActiva = "Grupos";

        window.onload = function() {
            // Inicialización de emergencia inmediata: si la red falla, la web ya está pintada
            actualizarPantallaQuiniela(); 
            cargarDatosNube();
        };

        function mostrarCarga(porcentaje) {
            const bar = document.getElementById('loading-bar');
            if(bar) bar.style.width = `${porcentaje}%`;
        }

        async function cargarDatosNube() {
            mostrarCarga(30);
            try {
                const res = await fetch(`${API_URL}/latest`, { 
                    method: 'GET',
                    headers: { "X-Master-Key": API_KEY } 
                });
                
                if (!res.ok) {
                    throw new Error("Respuesta inválida de JSONBin");
                }
                
                const data = await res.json();
                
                if (data && data.record) {
                    if (data.record.partidos && data.record.partidos.length > 0) {
                        estadoGlobal = data.record;
                    } else {
                        // Si el bin está vacío en la nube, lo estructuramos localmente y lo subimos
                        estadoGlobal.usuarios = data.record.usuarios || ["fedy", "Carlos"];
                        estadoGlobal.partidos = partidosBase;
                        estadoGlobal.pronosticos = data.record.pronosticos || {};
                        await guardarDatosNube();
                    }
                }
                mostrarCarga(100);
            } catch (err) {
                console.warn("⚠️ JSONBin no responde. Usando base de datos local a prueba de fallos.");
                mostrarCarga(100);
            } finally {
                if(!estadoGlobal.usuarios.includes(usuarioActivo)) {
                    usuarioActivo = estadoGlobal.usuarios[0] || "fedy";
                }
                actualizarPantallaQuiniela();
            }
        }

        async function guardarDatosNube() {
            mostrarCarga(50);
            try {
                const respuesta = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(estadoGlobal)
                });
                mostrarCarga(100);
                actualizarPantallaQuiniela();
                return respuesta.ok;
            } catch (err) {
                console.error("Error al guardar en la nube:", err);
                mostrarCarga(100);
                actualizarPantallaQuiniela();
                return false;
            }
        }

        async function registrarUsuario() {
            const nombreNuevo = document.getElementById('nuevo-usuario').value.trim();
            if (!nombreNuevo) return alert("⚠️ Ingresa un nombre válido.");
            if (estadoGlobal.usuarios.includes(nombreNuevo)) return alert("⚠️ Este usuario ya existe.");

            estadoGlobal.usuarios.push(nombreNuevo);
            usuarioActivo = nombreNuevo;
            localStorage.setItem('q_pro_usuario', nombreNuevo);
            document.getElementById('nuevo-usuario').value = '';

            actualizarPantallaQuiniela();
            await guardarDatosNube();
        }

        function cambiarUsuario() {
            usuarioActivo = document.getElementById('select-usuario').value;
            localStorage.setItem('q_pro_usuario', usuarioActivo);
            actualizarPantallaQuiniela();
        }

        function cambiarFaseFiltro(faseSeleccionada) {
            faseActiva = faseSeleccionada;
            const subFases = ["Grupos", "Octavos", "Cuartos", "Semifinales", "Finales"];
            subFases.forEach(f => {
                const btn = document.getElementById(`tab-${f}`);
                if (btn) {
                    if (f === faseSeleccionada) {
                        btn.className = "w-full font-bold py-3 px-4 rounded-lg text-sm bg-purple-600 text-white shadow-md border border-purple-500";
                    } else {
                        btn.className = "w-full font-bold py-3 px-4 rounded-lg text-sm bg-gray-800 text-gray-400 hover:text-gray-200 transition border border-transparent";
                    }
                }
            });
            const titulo = document.getElementById('nombre-fase-titulo');
            if(titulo) titulo.textContent = faseSeleccionada;
            actualizarPantallaQuiniela();
        }

        function calcularPuntosUsuario(nombreUser) {
            let puntos = 0;
            const misPronos = estadoGlobal.pronosticos[nombreUser] || {};
            
            estadoGlobal.partidos.forEach(p => {
                if (p.golesA !== null && p.golesB !== null && misPronos[p.id]) {
                    const prono = misPronos[p.id];
                    if (prono.golesA !== '' && prono.golesB !== '') {
                        const gA_real = parseInt(p.golesA);
                        const gB_real = parseInt(p.golesB);
                        const gA_prono = parseInt(prono.golesA);
                        const gB_prono = parseInt(prono.golesB);

                        if (gA_real === gA_prono && gB_real === gB_prono) {
                            puntos += 3;
                        } else if ((gA_real > gB_real && gA_prono > gB_prono) || 
                                   (gA_real < gB_real && gA_prono < gB_prono) || 
                                   (gA_real === gB_real && gA_prono === gB_prono)) {
                            puntos += 1;
                        }
                    }
                }
            });
            return puntos;
        }

        function actualizarPantallaQuiniela() {
            // 1. Selector de Usuarios
            const select = document.getElementById('select-usuario');
            if(select) {
                select.innerHTML = '';
                estadoGlobal.usuarios.forEach(u => {
                    select.innerHTML += `<option value="${u}" ${u===usuarioActivo?'selected':''}>${u}</option>`;
                });
            }
            const badge = document.getElementById('badge-usuario');
            if(badge) badge.textContent = usuarioActivo || "Invitado";
            
            // 2. Tabla de Posiciones Globales
            const tabla = document.getElementById('tabla-posiciones');
            if(tabla) {
                tabla.innerHTML = '';
                let listaOrdenada = estadoGlobal.usuarios.map(u => {
                    return { nombre: u, pts: calcularPuntosUsuario(u) };
                }).sort((a,b) => b.pts - a.pts);

                listaOrdenada.forEach((jugador, i) => {
                    tabla.innerHTML += `
                        <tr class="hover:bg-gray-700/50 transition">
                            <td class="p-2 text-center font-bold text-gray-400">${i + 1}</td>
                            <td class="p-2 font-medium text-white">${jugador.nombre}</td>
                            <td class="p-2 text-center font-bold text-yellow-400">${jugador.pts}</td>
                            <td class="p-2 text-center">
                                <button onclick="eliminarUsuarioGlobal('${jugador.nombre}')" class="text-red-400 hover:text-red-500 transition">🗑️</button>
                            </td>
                        </tr>`;
                });
            }

            // 3. Renderizado de Partidos
            const contenedor = document.getElementById('lista-partidos-contenedor');
            if(!contenedor) return;
            contenedor.innerHTML = '';

            const partidosFase = estadoGlobal.partidos.filter(p => p.fase === faseActiva);
            let llavesDeAgrupacion = [];
            partidosFase.forEach(p => {
                let clave = (faseActiva === "Grupos") ? p.grupo : (p.jornada || faseActiva);
                if(!llavesDeAgrupacion.includes(clave)) llavesDeAgrupacion.push(clave);
            });

            if(partidosFase.length === 0) {
                contenedor.innerHTML = `<p class="text-center py-8 text-gray-500 text-sm">No hay partidos cargados en esta fase.</p>`;
                return;
            }

            const misPronos = estadoGlobal.pronosticos[usuarioActivo] || {};

            llavesDeAgrupacion.forEach(nombreContenedor => {
                const partidosDelBloque = partidosFase.filter(p => (faseActiva === "Grupos" ? p.grupo === nombreContenedor : (p.jornada || faseActiva) === nombreContenedor));

                let bloqueHTML = `
                    <div class="bg-gray-800/40 rounded-xl p-4 border border-gray-700/60 shadow-sm">
                        <h3 class="text-md font-bold text-indigo-400 mb-4 border-b border-gray-700 pb-1 uppercase tracking-wider">📅 ${nombreContenedor}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                `;

                partidosDelBloque.forEach(partido => {
                    const prono = misPronos[partido.id] || { golesA: '', golesB: '' };
                    const bloqueado = partido.golesA !== null || partido.golesB !== null;
                    const badgeResultado = bloqueado ? `<span class="bg-gray-800 text-yellow-400 font-mono text-[11px] px-2 py-0.5 rounded border border-gray-700">OFICIAL: ${partido.golesA} - ${partido.golesB}</span>` : `<span class="text-emerald-500">Abierto</span>`;

                    bloqueHTML += `
                        <div class="bg-gray-950/40 p-3 rounded-lg border border-gray-800 flex flex-col justify-between items-center transition hover:border-purple-900/40">
                            <div class="w-full flex justify-between text-[10px] text-gray-500 mb-2 px-1 font-mono">
                                <span>ID: #${partido.id}</span>
                                ${badgeResultado}
                                <span>${partido.fechaStr} | ${partido.horaStr}</span>
                            </div>
                            <div class="w-full flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2 w-[40%] truncate">
                                    <span class="text-sm font-medium text-gray-200">${partido.equipoA}</span>
                                </div>
                                <div class="flex items-center justify-center gap-1 w-[20%]">
                                    <input type="number" id="prono-A-${partido.id}" value="${prono.golesA}" ${bloqueado?'disabled':''} class="w-10 bg-gray-800 border border-gray-700 rounded text-center text-sm py-1 font-bold text-white focus:outline-none focus:border-purple-500">
                                    <span class="text-xs text-gray-600 font-bold">-</span>
                                    <input type="number" id="prono-B-${partido.id}" value="${prono.golesB}" ${bloqueado?'disabled':''} class="w-10 bg-gray-800 border border-gray-700 rounded text-center text-sm py-1 font-bold text-white focus:outline-none focus:border-purple-500">
                                </div>
                                <div class="flex items-center justify-end gap-2 w-[40%] text-right truncate">
                                    <span class="text-sm font-medium text-gray-200">${partido.equipoB}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                bloqueHTML += `</div></div>`;
                contenedor.innerHTML += bloqueHTML;
            });
        }

        async function guardarPronosticos() {
            if(!usuarioActivo) return alert("⚠️ Selecciona o registra un usuario primero.");
            
            if(!estadoGlobal.pronosticos[usuarioActivo]) estadoGlobal.pronosticos[usuarioActivo] = {};

            const partidosFase = estadoGlobal.partidos.filter(p => p.fase === faseActiva);
            partidosFase.forEach(p => {
                const inputA = document.getElementById(`prono-A-${p.id}`);
                const inputB = document.getElementById(`prono-B-${p.id}`);
                
                if(inputA && inputB && !inputA.disabled) {
                    if(inputA.value !== '' && inputB.value !== '') {
                        estadoGlobal.pronosticos[usuarioActivo][p.id] = {
                            golesA: inputA.value,
                            golesB: inputB.value
                        };
                    }
                }
            });

            const guardado = await guardarDatosNube();
            if(guardado) alert("💾 Pronósticos guardados en la nube con éxito.");
            else alert("⚠️ Guardado de forma local (Error al subir a la nube).");
        }

        async function eliminarUsuarioGlobal(nombreUsuario) {
            const confirmacionClave = prompt(`🔒 Escribe la contraseña admin para borrar a "${nombreUsuario}":`);
            if (confirmacionClave === LLAVE_ADMIN) {
                estadoGlobal.usuarios = estadoGlobal.usuarios.filter(u => u !== nombreUsuario);
                if (estadoGlobal.pronosticos[nombreUsuario]) delete estadoGlobal.pronosticos[nombreUsuario];
                if (usuarioActivo === nombreUsuario) usuarioActivo = estadoGlobal.usuarios[0] || "fedy";
                await guardarDatosNube();
            } else if (confirmacionClave !== null) {
                alert("❌ Contraseña incorrecta.");
            }
        }

        function verificarAccesoAdmin() {
            const pass = prompt("🔒 Contraseña del administrador:");
            if (pass === LLAVE_ADMIN) {
                document.getElementById('modal-admin').classList.remove('hidden');
                renderizarListaPartidosAdmin();
            } else if (pass !== null) {
                alert("❌ Contraseña Incorrecta.");
            }
        }

        function cerrarModalAdmin() {
            document.getElementById('modal-admin').classList.add('hidden');
        }

        function renderizarListaPartidosAdmin() {
            const filtroFase = document.getElementById('admin-filtro-fase-lista').value;
            const contenedor = document.getElementById('admin-lista-partidos-render');
            if(!contenedor) return;
            contenedor.innerHTML = '';

            const filtrados = estadoGlobal.partidos.filter(p => p.fase === filtroFase);
            filtrados.forEach(p => {
                const gA = p.golesA !== null ? p.golesA : '';
                const gB = p.golesB !== null ? p.golesB : '';

                contenedor.innerHTML += `
                    <div class="bg-gray-900 p-2 rounded border border-gray-700 flex justify-between items-center text-xs">
                        <span class="text-gray-400 font-mono w-12">#${p.id}</span>
                        <div class="flex-1 flex justify-between items-center px-2">
                            <span class="text-gray-200 truncate text-left w-24">${p.equipoA}</span>
                            <div class="flex gap-1">
                                <input type="number" id="admin-real-A-${p.id}" value="${gA}" class="w-8 bg-gray-800 text-center text-white border border-gray-600 rounded font-bold">
                                <span class="text-gray-500">:</span>
                                <input type="number" id="admin-real-B-${p.id}" value="${gB}" class="w-8 bg-gray-800 text-center text-white border border-gray-600 rounded font-bold">
                            </div>
                            <span class="text-gray-200 truncate text-right w-24">${p.equipoB}</span>
                        </div>
                    </div>`;
            });
        }

        async function guardarResultadosAdminReales() {
            const filtroFase = document.getElementById('admin-filtro-fase-lista').value;
            const filtrados = estadoGlobal.partidos.filter(p => p.fase === filtroFase);

            filtrados.forEach(p => {
                const inputA = document.getElementById(`admin-real-A-${p.id}`);
                const inputB = document.getElementById(`admin-real-B-${p.id}`);
                if(inputA && inputB) {
                    if(inputA.value !== '' && inputB.value !== '') {
                        p.golesA = parseInt(inputA.value);
                        p.golesB = parseInt(inputB.value);
                    } else {
                        p.golesA = null;
                        p.golesB = null;
                    }
                }
            });

            await guardarDatosNube();
            cerrarModalAdmin();
        }
    </script>
</body>
</html>
